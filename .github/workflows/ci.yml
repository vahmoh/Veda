# Builds Veda and runs its tests on GitHub's runners, for every push and
# every pull request from a fork (one from a branch of this repository is
# tested by its push), for each architecture
# (.github/workflows/architecture.yml).

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  amd64:
    name: AMD64
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/architecture.yml
    with:
      architecture: amd64
      outputs: target
      qemu: qemu-system-x86 ovmf
      kvm: true

  # The runners are PCs: QEMU emulates the processor.
  arm64:
    name: ARM64
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/architecture.yml
    with:
      architecture: arm64
      outputs: target/arm64
      qemu: qemu-system-arm qemu-efi-aarch64
      kvm: false
