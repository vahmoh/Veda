[package]
name = "musicgen"
description = "Composes and renders the sample music shipped with Veda"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "musicgen"

[[bin]]
name = "musicgen"
path = "src/main.rs"

[[bin]]
name = "audiocheck"
path = "src/audiocheck.rs"

[dependencies]
vaudio = { workspace = true }
vimage = { workspace = true, features = ["encode"] }

[lints]
workspace = true
