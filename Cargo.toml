    "implementation/libraries/elf",
    "implementation/libraries/posix",
    "implementation/libraries/raster",
    "implementation/libraries/font",
    "implementation/libraries/image",
    "implementation/libraries/heap",
    "implementation/libraries/build",
    "implementation/libraries/rt",
    "implementation/libraries/ipc",
    "implementation/libraries/proto",
    "implementation/libraries/virtio",
    "implementation/libraries/gfx",
    "implementation/libraries/ui",
    "implementation/libraries/text",
    "implementation/libraries/files",
    "implementation/libraries/audio",
    "implementation/libraries/entropy",
    "implementation/libraries/netstack",
    "implementation/libraries/net",
    "implementation/libraries/tls",
    "implementation/libraries/wlan",
    "implementation/libraries/radiolink",
    "implementation/libraries/json",
    "implementation/libraries/web",
    "implementation/libraries/agent",
    "implementation/libraries/acpi",
    "implementation/libraries/gpio",
    "implementation/libraries/splash",
    "implementation/libraries/glsl",
    "implementation/libraries/gl",
    "implementation/libraries/hv",
    "implementation/libraries/iommu",
    "implementation/services/init",
    "implementation/services/mediadec",
    "implementation/services/vfs",
    "implementation/services/devmgr",
    "implementation/services/compositor",
    "implementation/services/netd",
    "implementation/services/wlan",
    "implementation/services/agent",
    "implementation/services/drivervm",
    "implementation/applications/about",
    "implementation/applications/shell",
    "implementation/applications/editor",
    "implementation/applications/photos",
    "implementation/applications/music",
    "implementation/applications/videos",
    "implementation/applications/terminal",
    "implementation/applications/taskmgr",
    "implementation/applications/files",
    "implementation/applications/settings",
    "implementation/applications/interceptor",
    "implementation/applications/interceptor/game",
    "implementation/applications/videos/core",
    "implementation/services/audio",
    "tools/assetgen",
    "tools/musicgen",
    "tools/videogen",
    "tools/airsim",
    "implementation/drivers/virtio-blk",
    "implementation/drivers/ahci",
    "implementation/drivers/nvme",
    "verification/systest",
    "verification/nettest",
    "verification/testmic",
    "verification/audiotest",
    "verification/fakedec",
    "implementation/guest/init",
    "implementation/guest/bridgetest",
    "implementation/guest/pcitest",
    "implementation/guest/gpiotest",
    "implementation/guest/efivartest",
    "implementation/guest/kmspause",
    "implementation/guest/logkeeper",
    "implementation/guest/sys",
    "implementation/guest/alsa",
    "implementation/guest/net",
    "implementation/guest/netlink",
    "implementation/guest/wifi",
    "implementation/guest/airlink",
    "implementation/guest/kms",
    "implementation/guest/input",
    "implementation/guest/renderer",
]
# The crates in ports/, as `cargo xtask` prepares them for Cargo, are not
# members (their own tests and dev-dependencies stay out of this
# workspace): see "Crates" in ports/README.md.
exclude = ["ports/.crates"]
# Plain `cargo build` only builds the host-side build tool. Everything that runs
# inside Veda is cross-built by `cargo xtask build`, which knows the correct
# target for every component.
default-members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Vahid Mohammadi"]
repository = "https://github.com/vahmoh25/Veda"

[workspace.dependencies]
vabi = { path = "implementation/libraries/abi" }
bootinfo = { path = "implementation/libraries/bootinfo" }
initrd = { path = "implementation/libraries/initrd" }
vpe = { path = "implementation/libraries/pe" }
velf = { path = "implementation/libraries/elf" }
vposix = { path = "implementation/libraries/posix" }
vraster = { path = "implementation/libraries/raster" }
vfont = { path = "implementation/libraries/font" }
vimage = { path = "implementation/libraries/image" }
vheap = { path = "implementation/libraries/heap" }
vbuild = { path = "implementation/libraries/build" }
vrt = { path = "implementation/libraries/rt" }
vipc = { path = "implementation/libraries/ipc" }
vproto = { path = "implementation/libraries/proto" }
vvirtio = { path = "implementation/libraries/virtio" }
vgfx = { path = "implementation/libraries/gfx" }
vui = { path = "implementation/libraries/ui" }
vtext = { path = "implementation/libraries/text" }
vfiles = { path = "implementation/libraries/files" }
vaudio = { path = "implementation/libraries/audio" }
ventropy = { path = "implementation/libraries/entropy" }
vnetstack = { path = "implementation/libraries/netstack" }
vnet = { path = "implementation/libraries/net" }
vtls = { path = "implementation/libraries/tls" }
vwlan = { path = "implementation/libraries/wlan" }
vradiolink = { path = "implementation/libraries/radiolink" }
vjson = { path = "implementation/libraries/json" }
vweb = { path = "implementation/libraries/web" }
vagent = { path = "implementation/libraries/agent" }
vacpi = { path = "implementation/libraries/acpi" }
vgpio = { path = "implementation/libraries/gpio" }
vsplash = { path = "implementation/libraries/splash" }
vglsl = { path = "implementation/libraries/glsl" }
vgl = { path = "implementation/libraries/gl" }
vhv = { path = "implementation/libraries/hv" }
viommu = { path = "implementation/libraries/iommu" }
guest-sys = { path = "implementation/guest/sys" }
guest-netlink = { path = "implementation/guest/netlink" }
# Cryptography for Wi-Fi security (RustCrypto, all no_std, pure Rust).
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
hkdf = { version = "0.13", default-features = false }
aes = { version = "0.9", default-features = false }
ccm = { version = "0.6", default-features = false }
cmac = { version = "0.8", default-features = false }
aes-kw = { version = "0.3", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "hash2curve"] }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.9", default-features = false }
# TLS (HTTPS, secure WebSockets): rustls, with a CryptoProvider built on the
# RustCrypto crates (implementation/libraries/tls). Same RustCrypto
# generation as above.
rustls = { version = "0.23.45", default-features = false, features = ["tls12", "custom-provider"] }
webpki-roots = { version = "1.0.9", default-features = false }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
# AV1 encoding for tools/videogen only (the sample videos, made on the
# build machine; never in the image): Veda decodes AV1, but has no encoder
# of its own. No assembly, no threads, so it encodes the same everywhere.
rav1e = { version = "0.8.1", default-features = false }
ed25519-dalek = { version = "3", default-features = false }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh"] }
crypto-bigint = { version = "0.7.5", default-features = false, features = ["alloc"] }
# HTTP/1.x message parsing (no_std).
httparse = { version = "1.10", default-features = false }
# Floating-point functions, which `core` lacks on stable Rust: libm, the Rust
# project's port of musl's, called directly (`libm::sqrtf(x)`) or through
# num-traits' `Float` (`use num_traits::Float;` gives `x.sqrt()`, `x.sin()`).
libm = "0.2.16"
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
# Vectors, matrices and quaternions for 3D graphics (Interceptor). Without
# std it takes its float functions from libm.
glam = { version = "0.34.1", default-features = false, features = ["nostd-libm"] }
# Random numbers that are the same everywhere for a seed: PCG32, and normal
# and directional distributions.
rand = { version = "0.10.3", default-features = false, features = ["alloc"] }
rand_pcg = { version = "0.10.2", default-features = false }
rand_distr = { version = "0.6.0", default-features = false }
# Gradient noise for procedural terrain and pictures (FastNoise Lite's
# official Rust port).
fastnoise-lite = { version = "1.1.1", default-features = false, features = ["libm"] }
# Image decoding: zune's JPEG (the `image` crate's), PNG and BMP decoders,
# the `qoi` crate and fast_image_resize's resampling, all without std. Their
# SIMD needs std's run-time CPU detection, so in Veda they run their portable
# code (fast_image_resize detects the CPU itself).
zune-core = { version = "0.5.3", default-features = false }
# zune-jpeg, which Veda builds with a fix of its own, is a port
# (ports/zune-jpeg): Cargo builds it in place of the release of the version
# it pins (see "Crates" in ports/README.md).
zune-jpeg = { version = "=0.5.15", default-features = false }
zune-png = { version = "0.5.2", default-features = false }
zune-bmp = { version = "0.5.2", default-features = false }
# The PNG decoder's zlib, named for its errors (truncated data, Adler-32).
zune-inflate = { version = "0.2.54", default-features = false, features = ["zlib"] }
qoi = { version = "0.4.1", default-features = false, features = ["alloc"] }
fast_image_resize = { version = "6.1.0", default-features = false, features = ["no_std"] }
# Pixel buffers seen as the bytes the image libraries read and write.
bytemuck = { version = "1.25.2", default-features = false }
# Image encoding, on the build machine only (generated pictures, test
# output): PNG (the `image` crate's) and JPEG with progressive scans; and
# zlib and CRC-32 for the image tests' hand-made PNGs.
png = "0.18.1"
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
miniz_oxide = "0.9.1"
crc32fast = "1.5.2"
# The TCP/IP stack, which Veda builds with a security patch: a port
# (ports/smoltcp), like zune-jpeg.
smoltcp = { version = "=0.14.0", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv4-fragmentation",
    "proto-dhcpv4",
    "proto-ipv6",
    "proto-ipv6-slaac",
    "proto-dns",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "socket-dhcpv4",
    "multicast",
    "auto-icmp-echo-reply",
    "iface-max-addr-count-6",
    "iface-max-route-count-8",
    "iface-max-prefix-count-2",
    "iface-neighbor-cache-count-32",
    "iface-max-multicast-group-count-8",
    "assembler-max-segment-count-8",
    "reassembly-buffer-size-4096",
    "reassembly-buffer-count-4",
    "fragmentation-buffer-size-4096",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Set for the programs of the driver VM's Linux guest (.cargo/arch/*/config.toml).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(veda_guest)"] }
missing_debug_implementations = "allow"

[workspace.lints.clippy]
missing_safety_doc = "allow"
new_without_default = "allow"
# Drawing functions take a canvas, font, size, position, text and colour;
# bundling those into structs would only obscure the call sites.
too_many_arguments = "allow"

# The OS is always built with `panic = "abort"`: there is no unwinder in
# Veda. (Cargo ignores this for `cargo test`, which needs unwinding.)
[profile.dev]
panic = "abort"
# Unoptimised code is unusably slow under QEMU's TCG emulation.
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3
debug = false
codegen-units = 16
