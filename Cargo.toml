    "verification/nettest",
    "verification/testmic",
    "verification/audiotest",
    "verification/fakedec",
    "verification/stdcrates",
    "implementation/guests/linux/init",
    "implementation/guests/linux/bridgetest",
    "implementation/guests/linux/pcitest",
    "implementation/guests/linux/gpiotest",
    "implementation/guests/linux/efivartest",
    "implementation/guests/linux/kmspause",
    "implementation/guests/linux/logkeeper",
    "implementation/guests/linux/sys",
    "implementation/guests/linux/alsa",
    "implementation/guests/linux/net",
    "implementation/guests/linux/netlink",
    "implementation/guests/linux/wifi",
    "implementation/guests/linux/kms",
    "implementation/guests/linux/input",
    "implementation/guests/linux/renderer",
]
# The crates in implementation/ports/, as `cargo automation` prepares them
# for Cargo, are not members (their own tests and dev-dependencies stay out
# of this workspace): see "Crates" in implementation/ports/README.md. Nor is
# anything in target/, such as the release of Rust that the toolchain is
# built from.
exclude = ["implementation/ports/.crates", "target"]
# Plain `cargo build` only builds the host-side build tool. Everything that runs
# inside Veda is cross-built by `cargo automation build`, which knows the
# correct target for every component.
default-members = ["automation"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Vahid Mohammadi"]
repository = "https://github.com/vahmoh25/Veda"

[workspace.dependencies]
abi = { path = "implementation/libraries/abi" }
bootinfo = { path = "implementation/libraries/bootinfo" }
initrd = { path = "implementation/libraries/initrd" }
elf = { path = "implementation/libraries/elf" }
raster = { path = "implementation/libraries/raster" }
font = { path = "implementation/libraries/font" }
image = { path = "implementation/libraries/image" }
heap = { path = "implementation/libraries/heap" }
frames = { path = "implementation/libraries/frames" }
build = { path = "implementation/libraries/build" }
rt = { path = "implementation/libraries/rt" }
ipc = { path = "implementation/libraries/ipc" }
proto = { path = "implementation/libraries/proto" }
gfx = { path = "implementation/libraries/gfx" }
ui = { path = "implementation/libraries/ui" }
text = { path = "implementation/libraries/text" }
files = { path = "implementation/libraries/files" }
audio = { path = "implementation/libraries/audio" }
entropy = { path = "implementation/libraries/entropy" }
netstack = { path = "implementation/libraries/netstack" }
net = { path = "implementation/libraries/net" }
tls = { path = "implementation/libraries/tls" }
wlan = { path = "implementation/libraries/wlan" }
web = { path = "implementation/libraries/web" }
acpi = { path = "implementation/libraries/acpi" }
gpio = { path = "implementation/libraries/gpio" }
splash = { path = "implementation/shell/splash" }
glsl = { path = "implementation/libraries/glsl" }
gl = { path = "implementation/libraries/gl" }
egl = { path = "implementation/libraries/egl" }
hv = { path = "implementation/libraries/hv" }
iommu = { path = "implementation/libraries/iommu" }
guest-sys = { path = "implementation/guests/linux/sys" }
guest-netlink = { path = "implementation/guests/linux/netlink" }
# Cryptography for Wi-Fi security (RustCrypto, all no_std, pure Rust).
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
hkdf = { version = "0.13", default-features = false }
aes = { version = "0.9", default-features = false }
ccm = { version = "0.6", default-features = false }
cmac = { version = "0.8", default-features = false }
aes-kw = { version = "0.3", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "hash2curve"] }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.9", default-features = false }
# The lock screen's password (implementation/shell/lock/core): Argon2id,
# the memory-hard hash OWASP recommends for passwords, in the PHC string
# format, which records its salt and parameters (same RustCrypto
# generation as above).
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
# The kernel's random number generator (implementation/libraries/entropy):
# ChaCha20 (RFC 8439) and BLAKE2s, which wipe their state when dropped. On
# the soft-float targets they run their portable code
# (.cargo/architectures/amd64/config.toml).
chacha20 = { version = "0.10.2", default-features = false, features = ["cipher", "zeroize"] }
blake2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
# TLS (HTTPS, secure WebSockets): rustls, with a CryptoProvider built on the
# RustCrypto crates (implementation/libraries/tls). Same RustCrypto
# generation as above.
rustls = { version = "0.23.45", default-features = false, features = ["tls12", "custom-provider"] }
webpki-roots = { version = "1.0.9", default-features = false }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
# MD5 for implementation/generation/videos only: FLAC's STREAMINFO
# signature and the sample videos' picture fingerprints (what FFmpeg's
# decoder checks them against).
md-5 = { version = "0.11.0", default-features = false }
# AV1 encoding for implementation/generation/videos only (the sample
# videos, made on the build machine; never in the image): Veda decodes
# AV1, but has no encoder of its own. No assembly, no threads, so it
# encodes the same everywhere.
rav1e = { version = "0.8.1", default-features = false }
ed25519-dalek = { version = "3", default-features = false }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh"] }
crypto-bigint = { version = "0.7.5", default-features = false, features = ["alloc"] }
# JSON (the voice agent's protocols, applications' agent actions, saved
# settings): serde's data model, with derived types for Veda's own
# messages, and serde_json without std. Its objects are ordered maps
# (BTreeMap): no input makes parsing slow, and what is written comes out
# the same every time.
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
# A WebSocket server for `automation`'s stand-in for Deepgram's Voice
# Agent API, on the build machine only: RFC 6455's handshake, frames and
# closing handshake (same sha1 and rand generations as above).
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
# The Linux ABI that the POSIX layer gives musl (implementation/libraries/
# posix): constants and system call numbers as Linux's own headers define
# them, generated for each architecture.
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["general", "errno", "ioctl", "net", "prctl", "no_std"] }
# The driver VM's programs' Linux system calls beyond std's (mounting,
# polling, sockets of every family, ioctls, mappings): the Bytecode
# Alliance's safe bindings, which make the calls themselves on Linux,
# without libc, and type their files, flags and errors.
rustix = { version = "=1.1.5", default-features = false, features = ["std", "event", "fs", "mm", "mount", "net", "process", "system", "time"] }
# C's interfaces for the few Linux calls rustix does not make (socket
# options of netlink and packet sockets), through the guest's musl.
libc = { version = "=0.2.190", default-features = false }
# Random bytes from the operating system, in the two releases crates use
# (rand 0.10 the newer, rand 0.9 and others the older): what
# verification/stdcrates checks of Veda's ports of them (implementation/
# ports/getrandom and getrandom-0.3), as of libc's and rustix's, and of
# tempfile, which stands on them.
getrandom = { version = "=0.4.3", default-features = false, features = ["std"] }
getrandom-0-3 = { package = "getrandom", version = "=0.3.4", default-features = false, features = ["std"] }
tempfile = { version = "3.27.0", default-features = false, features = ["getrandom"] }
# The asynchronous runtime of Rust's ecosystem, on Veda's epoll, eventfd and
# sockets (implementation/ports/tokio, and mio and socket2 under it): what
# verification/stdcrates checks of them, and what crates built on it need.
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "macros", "io-util", "sync", "process"] }
# HTTP/1.x message parsing (no_std).
httparse = { version = "1.10", default-features = false }
# Percent-encoding of URL components: the `url` crate's own, without its
# Unicode tables (Veda's URLs are its web clients' few schemes).
percent-encoding = { version = "2.3.2", default-features = false, features = ["alloc"] }
# Base64 (WebSocket keys) and hexadecimal (Wi-Fi keys typed as hex): the
# RustCrypto crates', which work without data-dependent branches or tables,
# so secrets they decode leave no trace in timing.
base64ct = { version = "1.8.3", default-features = false, features = ["alloc"] }
base16ct = { version = "1.0.0", default-features = false, features = ["alloc"] }
# Floating-point functions, which `core` lacks on stable Rust: libm, the Rust
# project's port of musl's, called directly (`libm::sqrtf(x)`) or through
# num-traits' `Float` (`use num_traits::Float;` gives `x.sqrt()`, `x.sin()`).
libm = "0.2.16"
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
# The Calculator's exact arithmetic: fractions of 128-bit integers that
# add, multiply and divide exactly and say when they would overflow, and
# whole roots of integers (num's crates, without std).
num-rational = { version = "0.4.2", default-features = false }
num-integer = { version = "0.1.47", default-features = false }
# Vectors, matrices and quaternions for 3D graphics (Interceptor). Without
# std it takes its float functions from libm.
glam = { version = "0.34.1", default-features = false, features = ["nostd-libm"] }
# Random numbers that are the same everywhere for a seed: PCG32, and normal
# and directional distributions.
rand = { version = "0.10.3", default-features = false, features = ["alloc"] }
rand_pcg = { version = "0.10.2", default-features = false }
rand_distr = { version = "0.6.0", default-features = false }
# Gradient noise for procedural terrain and pictures (FastNoise Lite's
# official Rust port).
fastnoise-lite = { version = "1.1.1", default-features = false, features = ["libm"] }
# Fonts: ttf-parser reads the tables, character maps, names and outlines
# (TrueType and CFF) without std, allocations or unsafe code, and never
# panics on a malformed font; `font` builds Veda's metrics, kerning, caches
# and rendering on it. Its GPOS kerning needs `opentype-layout`; variable
# fonts (and CFF2) would add 45 KB to every program for instances `font`
# does not draw. (skrifa, Google Fonts' newer parser, adds hinting but
# some 600 KB to every program without whole-program LTO.)
ttf-parser = { version = "0.25.1", default-features = false, features = ["opentype-layout", "no-std-float"] }
# Unicode text: grapheme cluster boundaries (UAX #29: where a caret stands
# and what one press of an arrow key skips, a letter with its accents) and
# display width (which characters take no cell: combining marks), as Rust's
# editors and terminals use them. Both without std.
unicode-segmentation = "1.13.3"
unicode-width = { version = "0.2.2", default-features = false }
# Terminal escape sequences: Alacritty's parser of the DEC/ECMA-48 state
# machine (Paul Williams's), which decodes UTF-8 and splits parameters and
# their colon sub-parameters, without std.
vte = { version = "0.15.0", default-features = false }
# Image decoding: zune's JPEG (the `image` crate's), PNG and BMP decoders,
# the `qoi` crate and fast_image_resize's resampling, all without std. Their
# SIMD needs std's run-time CPU detection, so in Veda they run their portable
# code (fast_image_resize detects the CPU itself).
zune-core = { version = "0.5.3", default-features = false }
# zune-jpeg, which Veda builds with a fix of its own, is a port
# (implementation/ports/zune-jpeg): Cargo builds it in place of the release
# of the version it pins (see "Crates" in implementation/ports/README.md).
zune-jpeg = { version = "=0.5.15", default-features = false }
zune-png = { version = "0.5.2", default-features = false }
zune-bmp = { version = "0.5.2", default-features = false }
# The PNG decoder's zlib, named for its errors (truncated data, Adler-32).
zune-inflate = { version = "0.2.54", default-features = false, features = ["zlib"] }
qoi = { version = "0.4.1", default-features = false, features = ["alloc"] }
fast_image_resize = { version = "6.1.0", default-features = false, features = ["no_std"] }
# Pixel buffers seen as the bytes the image libraries read and write.
bytemuck = { version = "1.25.2", default-features = false }
# Image encoding (`image`'s `encode` feature), without std: Paint's saved
# pictures in Veda, and generated pictures and test output on the build
# machine. JPEG with progressive scans; PNG's zlib stream from miniz_oxide
# (the `flate2` crate's deflate), which also makes the image tests'
# hand-made PNGs. The `png` crate (the `image` crate's) reads the encoder's
# PNGs back in `image`'s tests: it needs std.
png = "0.18.1"
jpeg-encoder = { version = "0.7.1", default-features = false }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
# CRC-32 (IEEE 802.3): the VFS's snapshots of the home directory, GPT
# headers and the chunks of the PNGs `image` writes. Without std it picks
# its fastest code when it is compiled (slicing by 16 tables on a plain
# x86-64).
crc32fast = { version = "1.5.2", default-features = false }
# The TCP/IP stack, which Veda builds with a security patch: a port
# (implementation/ports/smoltcp), like zune-jpeg.
smoltcp = { version = "=0.14.0", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv4-fragmentation",
    "proto-dhcpv4",
    "proto-ipv6",
    "proto-ipv6-slaac",
    "proto-dns",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "socket-dhcpv4",
    "multicast",
    "auto-icmp-echo-reply",
    "iface-max-addr-count-6",
    "iface-max-route-count-8",
    "iface-max-prefix-count-2",
    "iface-neighbor-cache-count-32",
    "iface-max-multicast-group-count-8",
    "assembler-max-segment-count-8",
    "reassembly-buffer-size-4096",
    "reassembly-buffer-count-4",
    "fragmentation-buffer-size-4096",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# `veda_guest` is set for the programs of the driver VM's Linux guest
# (implementation/guests/linux/.cargo/config.toml); `target_os = "veda"` is
# the operating system of Veda's own target for programs on the standard
# library (the toolchain's Rust knows it, the build machine's does not).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(veda_guest)", 'cfg(target_os, values("veda"))'] }
missing_debug_implementations = "allow"

[workspace.lints.clippy]
missing_safety_doc = "allow"
new_without_default = "allow"
# Drawing functions take a canvas, font, size, position, text and colour;
# bundling those into structs would only obscure the call sites.
too_many_arguments = "allow"

# The OS is always built with `panic = "abort"`: there is no unwinder in
# Veda. (Cargo ignores this for `cargo test`, which needs unwinding.)
[profile.dev]
panic = "abort"
# Unoptimised code is unusably slow under QEMU's TCG emulation.
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3
debug = false
codegen-units = 16
