[package]
name = "paint"
description = "Paint: draw and edit pictures with brushes, shapes, text, selections and effects, unlimited undo, and PNG, JPEG, BMP and QOI files"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "paint"
test = false
bench = false

[dependencies]
vrt = { workspace = true }
vabi = { workspace = true }
vproto = { workspace = true }
vgfx = { workspace = true }
vimage = { workspace = true, features = ["encode"] }
vfiles = { workspace = true }
vui = { workspace = true }
libm = { workspace = true }
apps-common = { path = "../common" }
paint-core = { path = "core" }

[lints]
workspace = true
