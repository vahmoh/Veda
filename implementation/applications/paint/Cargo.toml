[package]
name = "paint"
description = "Paint: draw and edit pictures with brushes, shapes, text, selections and effects, unlimited undo, and PNG, JPEG, BMP and QOI files"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "paint"
path = "source/main.rs"
test = false
bench = false

[dependencies]
runtime = { workspace = true }
abi = { workspace = true }
proto = { workspace = true }
gfx = { workspace = true }
image = { workspace = true, features = ["encode"] }
files = { workspace = true }
ui = { workspace = true }
libm = { workspace = true }
apps-common = { path = "../common" }
paint-core = { path = "core" }

[lints]
workspace = true
