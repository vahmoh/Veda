[package]
name = "init"
description = "The first user-space process: starts and supervises system services"
version.workspace = true
edition.workspace = true
license.workspace = true

# What the launcher decides, tested on the host: the applications'
# manifests, and which of the installed packages' applications it lists and
# starts.
[lib]
path = "source/lib.rs"

[[bin]]
name = "init"
path = "source/main.rs"
test = false
bench = false

[dependencies]
abi = { workspace = true }
initrd = { workspace = true }
ipc = { workspace = true }
proto = { workspace = true }

# `runtime` on Veda's targets alone: its `runtime` feature (the program's
# entry point, allocator and panic handler) would clash with std's in the
# library's tests on the host ("Library crates" in
# documentation/CODING.md).
[target.'cfg(any(target_os = "veda", target_env = "musl"))'.dependencies]
runtime = { workspace = true }

[build-dependencies]
build = { workspace = true }

[lints]
workspace = true
