[package]
name = "driver-virtual-machine"
description = "The driver VM: Linux in a virtual machine, for the drivers Veda takes from it"
version.workspace = true
edition.workspace = true
license.workspace = true

# What the monitor decides that reaches no object of Veda's, tested on the
# host: the bridge's waits and window, the guest's budget, where its PCI
# functions go, the keyboard controller's commands.
[lib]
path = "source/lib.rs"

[[bin]]
name = "driver-virtual-machine"
path = "source/main.rs"
test = false
bench = false

[dependencies]
bootinfo = { workspace = true }
abi = { workspace = true }
hv = { workspace = true }
ipc = { workspace = true }
proto = { workspace = true }
initrd = { workspace = true }

# `runtime` on Veda's targets alone: its `runtime` feature (the program's
# entry point, allocator and panic handler) would clash with std's in the
# library's tests on the host ("Library crates" in
# documentation/CODING.md).
[target.'cfg(any(target_os = "veda", target_env = "musl"))'.dependencies]
runtime = { workspace = true }

[build-dependencies]
build = { workspace = true }

[lints]
workspace = true
