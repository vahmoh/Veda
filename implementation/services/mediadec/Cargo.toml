[package]
name = "mediadec"
description = "The media decoder: FFmpeg and dav1d in a sandboxed process, which Videos plays videos with"
version.workspace = true
edition.workspace = true
license.workspace = true

# Built for the architecture's bare target as a static library and linked
# with the C shim (shim/) and FFmpeg by Veda's GCC:
# orchestration/src/toolchain.rs.
[lib]
bench = false

[dependencies]
abi = { workspace = true }
rt = { workspace = true, default-features = false }
proto = { workspace = true }

[lints]
workspace = true
