[package]
name = "filesystem"
description = "The Veda virtual file system service"
version.workspace = true
edition.workspace = true
license.workspace = true

# The VFS's file systems apart from the service, tested on the host: the
# in-memory tree, the home directory's snapshots, who may reach what, and
# /dev/shm's shared memory objects.
[lib]
path = "source/lib.rs"

[[bin]]
name = "filesystem"
path = "source/main.rs"
test = false
bench = false

[dependencies]
abi = { workspace = true }
ipc = { workspace = true }
proto = { workspace = true }
initrd = { workspace = true }
crc32fast = { workspace = true }

# rt on Veda's targets alone: its runtime (the program's entry point,
# allocator and panic handler) would clash with std's in the library's
# tests on the host ("Library crates" in documentation/CODING.md).
[target.'cfg(any(target_os = "veda", target_env = "musl"))'.dependencies]
rt = { workspace = true }

[build-dependencies]
build = { workspace = true }

[lints]
workspace = true
