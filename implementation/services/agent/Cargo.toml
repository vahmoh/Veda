[package]
name = "agent"
description = "The voice agent that lives in Veda: conversations through Deepgram, actions on the system and its applications, memory and approvals"
version.workspace = true
edition.workspace = true
license.workspace = true

# What the voice agent decides without I/O, tested on the host: the Deepgram
# Voice Agent protocol, tools, memory, configuration and the approval policy.
[lib]
path = "source/lib.rs"

[[bin]]
name = "agent"
path = "source/main.rs"
test = false
bench = false

[dependencies]
abi = { workspace = true }
ipc = { workspace = true }
proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
percent-encoding = { workspace = true }
web = { workspace = true }
net = { workspace = true }
files = { workspace = true }
audio = { workspace = true }

# rt on Veda's targets alone: its runtime (the program's entry point,
# allocator and panic handler) would clash with std's in the library's
# tests on the host ("Library crates" in documentation/CODING.md).
[target.'cfg(any(target_os = "veda", target_env = "musl"))'.dependencies]
rt = { workspace = true }

[lints]
workspace = true
