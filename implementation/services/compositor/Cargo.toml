[package]
name = "compositor"
description = "The Veda window system: compositor, window manager and input router"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "compositor"
test = false
bench = false

[dependencies]
compositor-core = { path = "core" }
rt = { workspace = true }
abi = { workspace = true }
ipc = { workspace = true }
proto = { workspace = true }
gfx = { workspace = true }
num-traits = { workspace = true }
splash = { workspace = true }
gl = { workspace = true, features = ["veda"] }

[build-dependencies]
build = { workspace = true }

[lints]
workspace = true
