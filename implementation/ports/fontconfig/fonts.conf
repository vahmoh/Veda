<!--
  Veda's fontconfig configuration (/system/etc/fonts/fonts.conf): the
  system's fonts (/system/fonts: Veda's own, and Noto's for the world's
  scripts in /system/fonts/noto), the generic families web pages name and
  the fonts they are, and text drawn as Veda draws its own (greyscale,
  slightly hinted). A character the family asked for has not comes from
  the font that has it (fontconfig sorts them all by what they cover): the
  rules here only say which, where several do.
-->
<fontconfig>
  <dir>/system/fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>

  <!-- The commonest fonts pages name, which the system has not: the
       generic family of their kind. -->
  <alias><family>Arial</family><default><family>sans-serif</family></default></alias>
  <alias><family>Helvetica</family><default><family>sans-serif</family></default></alias>
  <alias><family>Helvetica Neue</family><default><family>sans-serif</family></default></alias>
  <alias><family>Segoe UI</family><default><family>sans-serif</family></default></alias>
  <alias><family>Roboto</family><default><family>sans-serif</family></default></alias>
  <alias><family>Open Sans</family><default><family>sans-serif</family></default></alias>
  <alias><family>Verdana</family><default><family>sans-serif</family></default></alias>
  <alias><family>Tahoma</family><default><family>sans-serif</family></default></alias>
  <alias><family>DejaVu Sans</family><default><family>sans-serif</family></default></alias>
  <alias><family>Liberation Sans</family><default><family>sans-serif</family></default></alias>

  <alias><family>Times</family><default><family>serif</family></default></alias>
  <alias><family>Times New Roman</family><default><family>serif</family></default></alias>
  <alias><family>Georgia</family><default><family>serif</family></default></alias>
  <alias><family>Cambria</family><default><family>serif</family></default></alias>
  <alias><family>DejaVu Serif</family><default><family>serif</family></default></alias>
  <alias><family>Liberation Serif</family><default><family>serif</family></default></alias>

  <alias><family>Courier</family><default><family>monospace</family></default></alias>
  <alias><family>Courier New</family><default><family>monospace</family></default></alias>
  <alias><family>Consolas</family><default><family>monospace</family></default></alias>
  <alias><family>Menlo</family><default><family>monospace</family></default></alias>
  <alias><family>Monaco</family><default><family>monospace</family></default></alias>
  <alias><family>DejaVu Sans Mono</family><default><family>monospace</family></default></alias>
  <alias><family>Liberation Mono</family><default><family>monospace</family></default></alias>

  <!-- A family no font has is sans-serif's. -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>sans-serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
    <edit name="family" mode="append_last"><string>sans-serif</string></edit>
  </match>

  <!-- The generic families, which the rules above end every list with. -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>Lato</family><family>Noto Sans Arabic</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Naskh Arabic</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="same">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="same">
    <family>math</family>
    <prefer><family>Noto Sans Math</family></prefer>
  </alias>

  <!-- Chinese, Japanese and Korean, each in its own region's forms of the
       characters they share (Noto Sans CJK has them all), by the text's
       language; Simplified Chinese's where it says none. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-mo</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <edit name="family" mode="append_last"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!-- As Veda draws text. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
</fontconfig>
