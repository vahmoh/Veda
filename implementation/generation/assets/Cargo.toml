[package]
name = "assetgen"
description = "Generates Veda wallpapers and sample media at build time"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "assetgen"
path = "source/main.rs"

[dependencies]
# What the generators share (a host library of implementation/generation/).
gencommon = { path = "../common" }
image = { workspace = true, features = ["encode"] }

[lints]
workspace = true
