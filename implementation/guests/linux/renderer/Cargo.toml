[package]
name = "guest-renderer"
description = "Veda's renderer in the driver VM: OpenGL ES command streams on Mesa's Gallium drivers, over the GPU's Linux driver"
version.workspace = true
edition.workspace = true
license.workspace = true

# The program's Rust half, which serves the `gpu` protocol. Mesa's build
# links it with the decoder (decoder/), its libdrm (drm/) and the Gallium
# drivers into the program (src/gallium/targets/veda, with the port
# implementation/ports/mesa).
[lib]
name = "renderer"
path = "source/lib.rs"
crate-type = ["staticlib"]
test = false
bench = false

[dependencies]
runtime = { workspace = true, default-features = false }
abi = { workspace = true }
ipc = { workspace = true }
proto = { workspace = true }
guest-sys = { workspace = true }
rustix = { workspace = true }

[lints]
workspace = true
