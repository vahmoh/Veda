[package]
name = "rt"
description = "The Veda user-space runtime: process entry, system calls, heap, threads, synchronisation and I/O"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "source/lib.rs"

[dependencies]
abi = { workspace = true }
heap = { workspace = true }
elf = { workspace = true }
hv = { workspace = true }
libm = { workspace = true }

[features]
default = ["runtime"]
# Entry point, global allocator, panic handler and C runtime symbols.
runtime = []

[lints]
workspace = true
