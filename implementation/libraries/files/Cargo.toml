[package]
name = "files"
description = "Files for applications: paths, file types and the apps that open them, size and time formatting, VFS access and image thumbnails"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "source/lib.rs"

[dependencies]
rt = { workspace = true, default-features = false }
abi = { workspace = true }
ipc = { workspace = true }
proto = { workspace = true }
gfx = { workspace = true, optional = true }
image = { workspace = true, optional = true }

[features]
# `thumbnails`: image thumbnails made on a background thread (needs the codecs).
thumbnails = ["dep:gfx", "dep:image"]

[lints]
workspace = true
