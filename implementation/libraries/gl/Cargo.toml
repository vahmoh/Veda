[package]
name = "gl"
description = "OpenGL ES 3.0: the API with complete error checking, a multi-threaded SIMD software renderer, and a virgl renderer for virtio-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "source/lib.rs"

[features]
# Running in Veda: the GPU service (virtio-gpu), or the software renderer on
# a worker thread per CPU.
veda = ["dep:rt", "dep:abi", "dep:ipc", "dep:proto"]
# Host tests of programs using OpenGL ES: the virgl renderer on the host's
# GPU, through the virglrenderer QEMU runs.
host-virgl = []

[dependencies]
glsl = { workspace = true }
libm = { workspace = true }
rt = { workspace = true, default-features = false, optional = true }
abi = { workspace = true, optional = true }
ipc = { workspace = true, optional = true }
proto = { workspace = true, optional = true }

[lints]
workspace = true
