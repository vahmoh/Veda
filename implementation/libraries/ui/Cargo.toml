[package]
name = "ui"
description = "The Veda GUI toolkit: windows, event loop, widgets, icons and dialogs"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "source/lib.rs"

[dependencies]
rt = { workspace = true, default-features = false }
abi = { workspace = true }
ipc = { workspace = true }
proto = { workspace = true }
gfx = { workspace = true }
libm = { workspace = true }
raster = { workspace = true }
files = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
# The icon gallery's picture (an ignored visual test).
image = { workspace = true, features = ["encode"] }

[lints]
workspace = true
