[package]
name = "posix"
description = "Veda's POSIX layer: the Linux system call interface of C programs (musl), over Veda's kernel objects and services"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "source/lib.rs"

[features]
# Built as the C library's layer, not for the host's tests: its allocator and
# panic handler, and the entry points C programs reach. The targets it is
# built for differ (`Architecture::bare_target`), so no `cfg` of theirs says.
layer = ["runtime/unwinding"]

[dependencies]
abi = { workspace = true }
runtime = { workspace = true, default-features = false }
ipc = { workspace = true }
proto = { workspace = true }
linux-raw-sys = { workspace = true }

[lints]
workspace = true
