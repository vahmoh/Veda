[package]
name = "stdcrates"
description = "Checks that crates which need Rust's standard library work on Veda, as its ports of libc, getrandom, rustix and tokio have them"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "stdcrates"
path = "source/main.rs"
test = false
bench = false

[dependencies]
libc = { workspace = true }
rustix = { workspace = true }
getrandom = { workspace = true }
getrandom-0-3 = { workspace = true }
rand = { workspace = true, features = ["std", "thread_rng"] }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
