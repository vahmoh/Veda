# What Cargo is told of each architecture's targets (their linkers and
# flags) is in .cargo/arch/<architecture>/config.toml. The crates in
# implementation/ports/ take the place of their releases once
# `cargo orchestration` has prepared them, in
# implementation/ports/.crates/config.toml (see "Crates" in
# implementation/ports/README.md).
include = [
    "arch/amd64/config.toml",
    { path = "../implementation/ports/.crates/config.toml", optional = true },
]

[alias]
# `cargo orchestration <command>` drives every development workflow (build,
# run, test).
orchestration = "run --quiet --package orchestration --"
