# What Cargo is told of each architecture's targets (their linkers and
# flags) is in .cargo/arch/<architecture>/config.toml.
include = ["arch/amd64/config.toml"]

[alias]
# `cargo xtask <command>` drives every development workflow (build, run, test).
xtask = "run --quiet --package xtask --"
