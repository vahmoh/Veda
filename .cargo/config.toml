# What Cargo is told of each architecture's targets (their linkers and
# flags) is in .cargo/arch/<architecture>/config.toml. The crates in
# implementation/ports/ take the place of their releases once `cargo xtask`
# has prepared them, in implementation/ports/.crates/config.toml (see
# "Crates" in implementation/ports/README.md).
include = [
    "arch/amd64/config.toml",
    { path = "../implementation/ports/.crates/config.toml", optional = true },
]

[alias]
# `cargo xtask <command>` drives every development workflow (build, run, test).
xtask = "run --quiet --package xtask --"
