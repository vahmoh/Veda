# Cargo's configuration of the AMD64 targets (included by .cargo/config.toml).

# The kernel's target is soft-float: LLVM cannot build the SIMD code
# (AES-NI, SSE2, AVX2) of the RustCrypto and dalek crates for it. The
# kernel's random number generator (implementation/libraries/entropy) and
# the no_std check of the libraries (`cargo build -p <crate> --target
# x86_64-unknown-none`) compile them: select their portable implementations
# there. User space is unaffected.
[target.x86_64-unknown-none]
rustflags = [
    "--cfg", "aes_backend=\"soft\"",
    "--cfg", "polyval_backend=\"soft\"",
    "--cfg", "chacha20_backend=\"soft\"",
    "--cfg", "poly1305_backend=\"soft\"",
    "--cfg", "sha1_backend=\"soft\"",
    "--cfg", "sha2_backend=\"soft\"",
    "--cfg", "curve25519_dalek_backend=\"serial\"",
]

# Veda's user-space programs: position-independent ELF64 executables for
# the System V ABI, built for Linux's musl target (whose `core` and `alloc`
# stable Rust ships hard-float) and linked by LLVM's linker, which Rust
# ships. Nothing of Linux or musl is in them: no start files or C library
# (`link-self-contained=no`); `rt` starts them, and `build` gives the
# linker the rest (see implementation/libraries/build). The driver VM's
# Linux programs, on this target too, are built apart, with musl:
# implementation/guests/linux/.cargo/config.toml.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=no"]
