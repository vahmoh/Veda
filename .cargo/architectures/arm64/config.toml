# Cargo's configuration of the ARM64 targets (included by .cargo/config.toml).

# The kernel's target is soft-float: it keeps no user's floating-point and
# SIMD registers while it runs, and LLVM cannot build the SIMD code of the
# RustCrypto and dalek crates for it. The kernel's random number generator
# (implementation/libraries/entropy) and the no_std check of the libraries
# (`cargo build -p <crate> --target aarch64-unknown-none-softfloat`) compile
# them: select their portable implementations there. User space is
# unaffected.
[target.aarch64-unknown-none-softfloat]
rustflags = [
    "--cfg", "aes_backend=\"soft\"",
    "--cfg", "polyval_backend=\"soft\"",
    "--cfg", "chacha20_backend=\"soft\"",
    "--cfg", "poly1305_backend=\"soft\"",
    "--cfg", "sha1_backend=\"soft\"",
    "--cfg", "sha2_backend=\"soft\"",
    "--cfg", "curve25519_dalek_backend=\"serial\"",
]

# Veda's user-space programs: position-independent ELF64 executables for
# the AAPCS64, built for Linux's musl target (whose `core` and `alloc` stable
# Rust ships hard-float) and linked by LLVM's linker, which Rust ships.
# Nothing of Linux or musl is in them: no start files or C library
# (`link-self-contained=no`); `runtime` starts them, and `build` gives the
# linker the rest, position independence among it, which Rust leaves out on
# this target (see implementation/libraries/build). The POSIX layer and
# the media decoder's Rust half are built for it too, as static libraries
# that C programs link. The driver VM's Linux programs, on this target too,
# are built apart, with musl: implementation/guests/linux/.cargo/config.toml.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=no"]
